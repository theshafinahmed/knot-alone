<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5ec8ff" />
    <title>Knot Alone</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <span id="logo">Knot Alone</span>
      <span id="status">Connecting…</span>
    </div>

    <div id="test-panel">
      <button id="btn-bots" title="Change number of robot buddies (B)">🤖 3</button>
      <button id="btn-mode" title="Robots follow you, or flop around like sacks (L)">🏃 Follow</button>
      <button id="btn-reset" title="Everyone back to the start (R)">↺</button>
    </div>

    <div id="hint">
      Click to look around · <b>WASD</b> move · <b>Space</b> jump · <b>B</b> bots · <b>L</b> lazy bots · <b>R</b> restart
    </div>

    <div id="joystick"><div id="knob"></div></div>
    <button id="jump" aria-label="Jump">⤒</button>

    <div id="loading">Loading…</div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
